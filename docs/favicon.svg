<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- La parabola del tiro, que es la figura que abre el sitio. Hereda el tema del sistema. -->
  <style>
    .fondo { fill: #fbfaf7 }
    .tinta { stroke: #16151a }
    .azul  { fill: #1b4fd4 }
    @media (prefers-color-scheme: dark) {
      .fondo { fill: #131316 }
      .tinta { stroke: #eceae4 }
      .azul  { fill: #7aa2ff }
    }
  </style>
  <rect class="fondo" width="32" height="32" rx="6"/>
  <path class="tinta" d="M5 25 Q16 3 27 25" fill="none" stroke-width="2.2" stroke-linecap="round"/>
  <circle class="azul" cx="16" cy="9.6" r="3"/>
</svg>
